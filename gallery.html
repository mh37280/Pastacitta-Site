<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pastacitta Gallery | Halal Italian Kitchen</title>
    <meta
      name="description"
      content="A visual tour of the Pastacitta kitchen — pasta, pizza, salads, risotto, and house desserts, all halal-certified."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="gallery-page">
    <main>
      <section
        class="hero-scroll hero-scroll-menu"
        id="gallery-top"
        style="--hero-image: url('./img/Background-gal.png')"
      >
        <div class="hero-pin">
          <div class="hero-media"></div>
          <div class="hero-overlay"></div>

          <div class="hero-content-shell">
            <header class="topbar hero-topbar">
              <a class="brand brand-light" href="./index.html#home" aria-label="Pastacitta home">
                <span class="brand-mark">
                  <img src="./img/Logo.jpg" alt="Pastacitta logo" />
                </span>
              </a>

              <nav class="topnav topnav-light" aria-label="Primary navigation">
                <a href="./index.html">Home</a>
                <a href="./menu.html">Menu</a>
                <a href="./catering.html">Catering</a>
                <a href="./gallery.html" class="is-current">Gallery</a>
                <a href="./index.html#about">Location</a>
                <a href="./index.html#visit">Visit</a>
                <a href="./index.html#contact">Contact</a>
              </nav>

              <a class="topbar-phone" href="tel:+61286064896" aria-label="Call (02) 8606 4896">
                <span class="phone-green">(02)</span> 8606 <span class="phone-red">4896</span>
              </a>
            </header>

            <div class="hero-text-stage hero-text-stage-menu">
              <div class="hero-panel hero-panel-main" data-hero-panel>
                <p class="eyebrow eyebrow-light">A look inside the kitchen</p>
                <h1>Gallery</h1>
                <p class="hero-subtitle hero-subtitle-narrow">
                  Every dish, plated and ready &mdash; from our wood-fired pizzas to handmade pasta, risotto, and house desserts.
                </p>
              </div>
            </div>

            <a class="scroll-indicator" href="#gallery-content" aria-label="Scroll to gallery">
              <span></span>
            </a>
          </div>
        </div>
      </section>

      <div class="page-shell page-shell-menu" id="gallery-content">
        <section class="gallery-sections" id="gallery-sections"></section>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
